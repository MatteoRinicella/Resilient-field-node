[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-field-node"
version = "0.1.0"
description = "Software MVP of a resilient electrical field node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4.0",]

[tool.setuptools.packages.find]
where = ["src"]